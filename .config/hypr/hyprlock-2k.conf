# Minimal hyprlock config for high-resolution monitors
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    no_fade_in = false
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(15, 15, 23)

    blur_size = 8
    blur_passes = 2
    noise = 0.005
    contrast = 1.0
    brightness = 0.4
    vibrancy = 0.1
    vibrancy_darkness = 0.3
}

# Time (top-center)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +\"%I:%M %p\")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 120
    font_family = "JetBrainsMono Nerd Font Bold"
    position = 0, 180
    halign = center
    valign = top
}

# Date under the time
label {
    monitor =
    text = cmd[update:18000000] echo "<b>"$(date +\"%A, %-d %B\")"</b>"
    color = rgba(255, 255, 255, 0.75)
    font_size = 28
    font_family = "JetBrainsMono Nerd Font SemiBold"
    position = 0, 70
    halign = center
    valign = top
}

# Minimal password input at the bottom center
input-field {
    monitor =
    size = 340, 65
    outline_thickness = 0
    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.35)
    capslock_color = rgb(249, 226, 175)
    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = false
    font_family = "JetBrainsMono Nerd Font"
    placeholder_text = <i><span foreground="#ffffff88">password</span></i>
    hide_input = false
    position = 0, 140
    halign = center
    valign = bottom
}

# Small unlock hint
label {
    monitor =
    text = press Enter to unlock
    color = rgba(255, 255, 255, 0.45)
    font_size = 14
    font_family = "JetBrainsMono Nerd Font"
    position = 0, 90
    halign = center
    valign = bottom
}
